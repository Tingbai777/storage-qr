<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>收纳箱内容</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --text:#1f2329; --muted:#8a9099; --line:#eceef1; --brand:#2b7de9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .pub-id{display:inline-block;font-size:13px;color:#fff;background:var(--brand);padding:3px 10px;border-radius:999px;margin-bottom:10px}
  h1{font-size:21px;margin:4px 0 10px}
  .pub-loc{color:var(--muted);font-size:14px;margin-bottom:6px}
  .pub-note{color:var(--text);font-size:14px;background:#f3f7ff;border-left:3px solid var(--brand);padding:8px 10px;border-radius:6px;margin:10px 0}
  .item-line{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
  .item-line .q{color:var(--brand);font-weight:600}
  .item-line .in{color:var(--muted);font-size:13px}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .photos img{width:100%;border-radius:10px;display:block}
  .hint{color:var(--muted);font-size:14px}
  .err{color:#e54545}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><p class="hint">加载中…</p></div>
</div>
<script>
  // 数据源：WorkBuddy 托管的公开读接口（CORS 已放开，任意域名可跨域读取）
  var API = "https://storage-qr.app.workbuddy.host/api/boxes";
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function idFromUrl(){
    var h=location.hash.replace(/^#\/?/,"");        // 支持 #B-01 与 #/B-01
    if(h)return decodeURIComponent(h);
    var m=location.search.match(/[?&]id=([^&]+)/);  // 兼容旧 ?id= 形式
    return m?decodeURIComponent(m[1]):"";
  }
  function photoSrc(u){if(/^https?:\/\//.test(u))return u;return API.replace(/\/api\/boxes$/,"")+"/"+u.replace(/^\//,"");}
  function render(box){
    var h='<span class="pub-id">箱号 '+esc(box.id)+'</span>';
    if(box.name)h+="<h1>"+esc(box.name)+"</h1>";
    if(box.location)h+='<div class="pub-loc">📍 '+esc(box.location)+"</div>";
    if(box.note)h+='<div class="pub-note">'+esc(box.note)+"</div>";
    var items=box.items||[];
    if(items.length){
      h+=items.map(function(it){return '<div class="item-line"><span>'+esc(it.name||"—")+(it.qty?' <span class="q">×'+esc(it.qty)+"</span>":"")+(it.note?' <span class="in">'+esc(it.note)+"</span>":"")+"</span></div>";}).join("");
    }else h+='<p class="hint">（暂无物品记录）</p>';
    var photos=(box.photos||[]).filter(Boolean);
    if(photos.length){h+='<div class="photos">'+photos.map(function(u){return '<img src="'+esc(photoSrc(u))+'" loading="lazy" onclick="window.open(this.src,\'_blank\')">';}).join("")+"</div>";}
    document.getElementById("card").innerHTML=h;
  }
  (function(){
    var id=idFromUrl();
    if(!id){document.getElementById("card").innerHTML='<p class="err">链接缺少箱子编号（?id=）</p>';return;}
    fetch(API,{cache:"no-store"}).then(function(r){return r.text();}).then(function(txt){
      var list; try{ list=JSON.parse(txt); }catch(e){ throw new Error("返回内容不是有效数据"); }
      var box=(list||[]).filter(function(x){return x.id===id;})[0];
      if(!box){document.getElementById("card").innerHTML='<p class="err">未找到箱子 '+esc(id)+"</p>";return;}
      render(box);
    }).catch(function(e){document.getElementById("card").innerHTML='<p class="err">加载失败：'+(e.message||e)+"</p>";});
  })();
</script>
</body>
</html>
