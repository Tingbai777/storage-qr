<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>收纳箱内容</title>
<style>
  :root{ --bg:#f5f6f8; --card:#fff; --text:#1f2329; --muted:#8a9099; --line:#eceef1; --brand:#2b7de9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .pub-id{display:inline-block;font-size:13px;color:#fff;background:var(--brand);padding:3px 10px;border-radius:999px;margin-bottom:10px}
  h1{font-size:21px;margin:4px 0 10px}
  .pub-loc{color:var(--muted);font-size:14px;margin-bottom:6px}
  .pub-note{color:var(--text);font-size:14px;background:#f3f7ff;border-left:3px solid var(--brand);padding:8px 10px;border-radius:6px;margin:10px 0}
  .item-line{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
  .item-line .q{color:var(--brand);font-weight:600}
  .item-line .in{color:var(--muted);font-size:13px}
  .photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .photos img{width:100%;border-radius:10px;display:block}
  .hint{color:var(--muted);font-size:14px}
  .err{color:#e54545}
  .ttl{font-size:16px;font-weight:700;margin:0 0 4px}
  .back{display:inline-block;color:var(--brand);font-size:14px;text-decoration:none;margin-bottom:8px}
  .li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
  .li:last-child{border-bottom:0}
  .li .nm{font-size:16px;font-weight:600;display:block}
  .li .sub{color:var(--muted);font-size:13px;display:block;margin-top:3px}
  .li .go{color:var(--brand);font-size:20px;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"><p class="hint">加载中…</p></div>
</div>
<script>
(function(){
  "use strict";
  // 数据源：WorkBuddy 托管的公开读接口（CORS 已放开，任意域名可跨域读取）
  var API = "https://storage-qr.app.workbuddy.host/api/boxes";
  var listCache = null;

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function apiRoot(){ return API.replace(/\/api\/boxes$/,""); }
  function photoSrc(u){ u = String(u||""); return /^(https?:)?\/\//.test(u) ? u : (apiRoot()+"/"+u.replace(/^\//,"")); }

  // 兼容多种链接形态：#B-01 / #/B-01 / #?id=B-01 / ?id=B-01 / ?box=B-01
  function idFromUrl(){
    var raw = String(location.hash || "").replace(/^#\/?/,"");
    if(raw){
      var h = raw.replace(/^\?/,"");
      var m = h.match(/(?:^|&)id=([^&]+)/);
      return decodeURIComponent(m ? m[1] : h);
    }
    var m2 = String(location.search || "").match(/[?&](?:id|box)=([^&]+)/);
    return m2 ? decodeURIComponent(m2[1]) : "";
  }
  function linkTo(id){ return "#" + encodeURIComponent(id); }

  function renderBox(box){
    var h = '<a class="back" href="#">‹ 全部箱子</a>';
    h += '<div><span class="pub-id">箱号 ' + esc(box.id) + '</span></div>';
    if(box.name) h += "<h1>" + esc(box.name) + "</h1>";
    if(box.location) h += '<div class="pub-loc">📍 ' + esc(box.location) + "</div>";
    if(box.note) h += '<div class="pub-note">' + esc(box.note) + "</div>";
    var items = box.items || [];
    if(items.length){
      h += items.map(function(it){
        var nm = esc(it.name || "—");
        var q  = it.qty  ? ' <span class="q">×' + esc(it.qty) + "</span>" : "";
        var nn = it.note ? ' <span class="in">' + esc(it.note) + "</span>" : "";
        return '<div class="item-line"><span>' + nm + q + nn + "</span></div>";
      }).join("");
    } else {
      h += '<p class="hint">（暂无物品记录）</p>';
    }
    var photos = (box.photos || []).filter(Boolean);
    if(photos.length){
      h += '<div class="photos">' + photos.map(function(u){
        var s = photoSrc(u);
        return '<img src="' + esc(s) + '" loading="lazy" alt="" onclick="try{window.open(this.src,\'_blank\')}catch(e){}">';
      }).join("") + "</div>";
    }
    el("card").innerHTML = h;
  }

  function renderList(list){
    if(!list.length){ el("card").innerHTML = '<p class="hint">还没有箱子。</p>'; return; }
    var h = '<p class="ttl">共 ' + list.length + ' 个箱子</p>';
    h += '<p class="hint" style="margin-top:0">点一下查看箱内物品</p>';
    h += list.map(function(b){
      var cnt = (b.items || []).length;
      var sub = [];
      if(b.location) sub.push(b.location);
      if(cnt) sub.push(cnt + " 件物品");
      return '<a class="li" href="' + linkTo(b.id) + '">'
           + '<span><span class="nm">' + esc(b.id) + (b.name ? " · " + esc(b.name) : "") + "</span>"
           + '<span class="sub">' + esc(sub.join(" · ")) + "</span></span>"
           + '<span class="go">›</span></a>';
    }).join("");
    el("card").innerHTML = h;
  }

  function renderError(msg){
    el("card").innerHTML = '<p class="err">加载失败' + (msg ? "：" + esc(msg) : "") + "</p>"
      + '<p><a class="back" href="#" onclick="location.reload();return false;">重试</a></p>';
  }

  function loadData(cb){
    if(listCache) return cb(null, listCache);
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done = true; cb("网络超时"); } }, 12000);
    fetch(API, { cache: "no-store" }).then(function(r){ return r.text(); }).then(function(txt){
      if(done) return;
      done = true; clearTimeout(timer);
      var list;
      try { list = JSON.parse(txt); } catch (e) { return cb("返回内容不是有效数据"); }
      if(!list || typeof list.length !== "number") return cb("数据格式异常");
      listCache = list;
      cb(null, list);
    }).catch(function(e){
      if(done) return;
      done = true; clearTimeout(timer);
      cb(String((e && e.message) || e || "网络错误"));
    });
  }

  function route(){
    try{
      var id = idFromUrl();
      loadData(function(err, list){
        try{
          if(err){ renderError(err); return; }
          if(!id){ renderList(list); return; }
          var box = null;
          for(var i = 0; i < list.length; i++){ if(list[i] && list[i].id === id){ box = list[i]; break; } }
          if(!box){
            el("card").innerHTML = '<p class="err">未找到箱子 ' + esc(id) + '</p>'
              + '<p><a class="back" href="#">‹ 查看全部箱子</a></p>';
            return;
          }
          renderBox(box);
        }catch(e2){ renderError(String((e2 && e2.message) || e2)); }
      });
    }catch(e){ renderError(String((e && e.message) || e)); }
  }

  window.addEventListener("hashchange", route);
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", route);
  else route();
})();
</script>
</body>
</html>
